
<p class="wp-block-paragraph">Die AG Schüeli sammelt die Daten der diversen Sport-Schüeli (Schülermeisterschaften) und anderer sportlichen Anlässe für Schulkinder in der Stadt Zürich. Die aktuellen Daten werden im Bulletin publiziert, zusammen mit weiteren Infos zum Anlass (Anmeldetermin, Kosten, etc.).</p>
