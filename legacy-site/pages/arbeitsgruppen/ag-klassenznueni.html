
<p class="wp-block-paragraph">Die AG Klassenznüni steht, wie der Name schon sagt, für alle Fragen und Anliegen rund ums Klassenznüni zur Verfügung. Sie lotet aus, welche Möglichkeiten bestehen, die Kommunikation und Empfehlungen rund um das Klassenznüni zu optimieren. Dies geschieht in Absprache mit der Schulleitung.</p>
